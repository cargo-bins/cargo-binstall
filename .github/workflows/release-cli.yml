name: Release CLI
on:
  workflow_call:
    inputs:
      info:
        description: "The release metadata JSON"
        required: true
        type: string
      CARGO_PROFILE_RELEASE_LTO:
        description: "Used to speed up CI"
        required: false
        type: string
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS:
        description: "Used to speed up CI"
        required: false
        type: string
    secrets:
      CI_RELEASE_TEST_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/release-packages.yml
    permissions:
      contents: read
    secrets:
      CI_RELEASE_TEST_GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN }}
    with:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.CARGO_PROFILE_RELEASE_LTO }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.CARGO_PROFILE_RELEASE_CODEGEN_UNITS }}
      # Never restore caches when building binaries that get published:
      # anything that can write to the Actions cache on main could otherwise
      # tamper with the release artifacts.
      cache: ${{ fromJSON(inputs.info).is-release != 'true' }}

  publish:
    needs: package
    permissions:
      contents: write
      id-token: write     # Required for OIDC token exchange
      attestations: write

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./ # action.yml from the checked out commit
      env:
        GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    - name: Install binaries required
      run: cargo binstall -y --force rsign2
      env:
        GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Create ephemeral keypair
      run: .github/scripts/ephemeral-gen.sh

    - name: Write ephemeral public key to Cargo.toml
      run: .github/scripts/ephemeral-crate.sh

    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      id: auth
      
    - if: fromJSON(inputs.info).is-release != 'true' && fromJSON(inputs.info).crate != ''
      name: DRY-RUN Publish to crates.io
      env:
        crate: ${{ fromJSON(inputs.info).crate }}
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: cargo publish --dry-run -p "$crate" --allow-dirty --no-default-features
    - if: fromJSON(inputs.info).is-release != 'true' && fromJSON(inputs.info).crate != ''
      name: Upload crate package as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: crate-package
        path: target/package/*.crate

    - if: fromJSON(inputs.info).is-release == 'true'
      name: Publish to crates.io
      env:
        crate: ${{ fromJSON(inputs.info).crate }}
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: cargo publish -p "$crate" --allow-dirty  --no-default-features

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifact
        pattern: package-*
        merge-multiple: true

    - name: Sign all pre-built binaries
      shell: bash
      run: .github/scripts/ephemeral-sign.sh artifact/*

    - run: cp minisign.pub artifact

    - name: Generate artifact attestation
      if: fromJSON(inputs.info).is-release == 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: artifact/*

    - if: fromJSON(inputs.info).is-release == 'true'
      name: Create draft release and upload artifacts
      # GitHub creates the v$version tag on --target when the draft is
      # published in the next step; an existing tag is used as is.
      run: |
        gh release create "v$version" --draft --target "$GITHUB_SHA" \
          --title "v$version" --notes "$notes" artifact/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        version: ${{ fromJSON(inputs.info).version }}
        notes: ${{ fromJSON(inputs.info).notes }}

    - if: fromJSON(inputs.info).is-release == 'true'
      name: Make release latest
      run: gh release edit "v$version" --latest --draft=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        version: ${{ fromJSON(inputs.info).version }}
