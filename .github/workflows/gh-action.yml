name: Test GitHub Action installer
on:
  merge_group:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - install-from-binstall-release.ps1
      - install-from-binstall-release.sh
      - action.yml
      - .github/workflows/gh-action.yml
  push:
    branches:
      - main
    paths:
      - install-from-binstall-release.ps1
      - install-from-binstall-release.sh
      - action.yml
      - .github/workflows/gh-action.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.event.pull_request.number || github.sha }}-${{ inputs.additional_key }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-gha-installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # The checkout's version is normally the latest release, so set it to
        # the previous one to tell the two apart.
        # - released: the action installs the checkout's version.
        # - unreleased: it has no release, so the action installs the latest.
        # - latest: `version: latest` overrides the checkout's version.
        case: [released, unreleased, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the checkout's version
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=cargo-bins/cargo-binstall
          latest="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
          tags="$(gh release list --repo "$repo" --exclude-drafts --exclude-pre-releases --limit 100 \
              --json tagName --jq '.[].tagName')"
          # Other crates in this repository have releases too.
          previous="$(printf '%s\n' "$tags" | grep -E '^v[0-9]' | grep -vxF "$latest" | sed -n 1p)" || true
          if [ -z "$previous" ]; then
              echo "::error::No cargo-binstall release other than $latest to test with"
              exit 1
          fi
          case "$CASE" in
              released) checkout="${previous#v}" expected="${previous#v}" ;;
              unreleased) checkout=9999.0.0 expected="${latest#v}" ;;
              latest) checkout="${previous#v}" expected="${latest#v}" ;;
          esac
          # No `$` anchor: the Windows checkout may have CRLF line endings.
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$checkout\"/" crates/bin/Cargo.toml
          grep -m 1 '^version = ' crates/bin/Cargo.toml
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"

      - name: Install cargo-binstall
        uses: ./ # uses action.yml from root of the repo
        with:
          version: ${{ matrix.case == 'latest' && 'latest' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify the installed version
        shell: bash
        run: |
          installed="$(cargo binstall -V)"
          echo "Installed $installed, expected $EXPECTED_VERSION"
          [ "$installed" = "$EXPECTED_VERSION" ]

      - name: Verify successful installation - display cargo-binstall's help
        run: cargo binstall --help

      - name: Verify successful installation - install example binary using cargo-binstall
        run: cargo binstall -y ripgrep
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify successful installation - display help of installed binary
        run: rg --help

  # Dummy job to have a stable name for the "all tests pass" requirement
  tests-pass:
    name: GHA installer test pass
    needs:
      - test-gha-installer
    if: always() # always run even if dependencies fail
    runs-on: ubuntu-latest
    steps:
      # fail if ANY dependency has failed or cancelled
      - if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
        run: exit 1
      - run: exit 0
