name: Test install-script

on:
  merge_group:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - install-from-binstall-release.ps1
      - install-from-binstall-release.sh
      - .github/workflows/install-script.yml
  push:
    branches:
      - main
    paths:
      - install-from-binstall-release.ps1
      - install-from-binstall-release.sh
      - .github/workflows/install-script.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        set_cargo_home: [t, f]
        set_binstall_version: ['no', 'with-v', 'without-v']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set `CARGO_HOME`
        if: matrix.set_cargo_home == 't'
        run: |
          CARGO_HOME="$(mktemp -d 2>/dev/null || mktemp -d -t 'cargo-home')"
          mkdir -p "${CARGO_HOME}/bin"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"

      - name: Set `BINSTALL_VERSION`
        if: matrix.set_binstall_version != 'no'
        env:
          STRIP_V: ${{ matrix.set_binstall_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # fetch most recent release tag.
          BINSTALL_VERSION="$(gh release list --json name --jq '[.[] | select(.name | startswith("v")) | .name] | first')"
          if [[ $STRIP_V == 'without-v' ]]; then BINSTALL_VERSION="${BINSTALL_VERSION#v*}"; fi
          echo "Setting BINSTALL_VERSION=$BINSTALL_VERSION"
          echo "BINSTALL_VERSION=$BINSTALL_VERSION" >> "$GITHUB_ENV"

      - name: Install `cargo-binstall` using scripts
        run: ./install-from-binstall-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify `cargo-binstall` installation
        run: |
          which cargo-binstall
          cargo binstall -vV

  windows:
    strategy:
      fail-fast: false
      matrix:
        set_cargo_home: [t, f]
        set_binstall_version: ['no', 'with-v', 'without-v']

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set `CARGO_HOME`
        if: matrix.set_cargo_home == 't'
        shell: bash
        run: |
          CARGO_HOME="$(mktemp -d 2>/dev/null || mktemp -d -t 'cargo-home')"
          mkdir -p "${CARGO_HOME}/bin"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"

      - name: Set `BINSTALL_VERSION`
        if: matrix.set_binstall_version != 'no'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STRIP_V: ${{ matrix.set_binstall_version }}
        run: |
          # fetch most recent release name.
          BINSTALL_VERSION="$(gh release list --json name --jq '[.[] | select(.name | startswith("v")) | .name] | first')"
          if [[ $STRIP_V == 'without-v' ]]; then BINSTALL_VERSION="${BINSTALL_VERSION#v*}"; fi
          echo "Setting BINSTALL_VERSION=$BINSTALL_VERSION"
          echo "BINSTALL_VERSION=$BINSTALL_VERSION" >> "$GITHUB_ENV"

      - name: Install `cargo-binstall` using scripts
        run: ./install-from-binstall-release.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify `cargo-binstall` installation
        run: cargo binstall -vV

  windows-bash:
    strategy:
      fail-fast: false
      matrix:
        set_cargo_home: [t, f]
        set_binstall_version: ['no', 'with-v', 'without-v']

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set `CARGO_HOME`
        if: matrix.set_cargo_home == 't'
        shell: bash
        run: |
          CARGO_HOME="$(mktemp -d 2>/dev/null || mktemp -d -t 'cargo-home')"
          mkdir -p "${CARGO_HOME}/bin"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"

      - name: Set `BINSTALL_VERSION`
        if: matrix.set_binstall_version != 'no'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STRIP_V: ${{ matrix.set_binstall_version }}
        run: |
          # fetch most recent release name.
          BINSTALL_VERSION="$(gh release list --json name --jq '[.[] | select(.name | startswith("v")) | .name] | first')"
          if [[ $STRIP_V == 'without-v' ]]; then BINSTALL_VERSION="${BINSTALL_VERSION#v*}"; fi
          echo "Setting BINSTALL_VERSION=$BINSTALL_VERSION"
          echo "BINSTALL_VERSION=$BINSTALL_VERSION" >> "$GITHUB_ENV"

      - name: Install `cargo-binstall` using scripts
        shell: bash
        run: ./install-from-binstall-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify `cargo-binstall` installation
        shell: bash
        run: cargo binstall -vV

  # Containers that only have wget, to test the fallback for when curl is
  # missing.
  linux-wget:
    name: linux-wget (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # busybox wget, which checks certificates through `ssl_client`
          - name: alpine
            image: alpine:latest
            setup: ''
            expect: success
          # GNU wget
          - name: debian
            image: debian:stable-slim
            setup: apt-get update && apt-get install -y --no-install-recommends wget ca-certificates
            expect: success
          # wget2 is Fedora's `wget`
          - name: fedora
            image: fedora:latest
            setup: dnf install -y wget2-wget && rpm -e --nodeps "$(rpm -qf "$(command -v curl)")"
            expect: success
          # busybox wget built with its own TLS code, which does not check
          # certificates, so the script must refuse it.
          - name: busybox
            image: busybox:musl
            setup: ''
            expect: refuse

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install `cargo-binstall` using scripts
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          EXPECT: ${{ matrix.expect }}
        run: |
          docker run --rm -e CI -e SETUP -e EXPECT -v "$PWD:/src:ro" "$IMAGE" sh -euc '
            eval "$SETUP"
            if command -v curl; then
              echo "curl is installed, so this does not test the wget fallback"
              exit 1
            fi
            if [ "$EXPECT" = refuse ]; then
              if sh /src/install-from-binstall-release.sh 2> err.log; then
                cat err.log
                echo "the install script accepted a wget that does not check certificates"
                exit 1
              fi
              cat err.log
              grep -q "This wget does not validate TLS certificates" err.log
              test ! -e "$HOME/.cargo/bin/cargo-binstall"
            else
              sh /src/install-from-binstall-release.sh
              "$HOME/.cargo/bin/cargo-binstall" -vV
            fi
          '

  # Dummy job to have a stable name for the "all tests pass" requirement
  tests-pass:
    name: Install scripts test pass
    needs:
      - unix
      - windows
      - windows-bash
      - linux-wget
    if: always() # always run even if dependencies fail
    runs-on: ubuntu-latest
    steps:
      # fail if ANY dependency has failed or cancelled
      - if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
        run: exit 1
      - run: exit 0
