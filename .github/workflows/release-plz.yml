name: Release-plz

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # open release PRs
      contents: write # push release tags and GitHub releases
      id-token: write # crates.io trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install stable --no-self-update --profile minimal
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cargo-semver-checks builds binstalk-downloader with its `http3`
          # feature enabled, which reqwest only compiles under this cfg
          # (same as ci.yml with JUST_ENABLE_H3 and release-pr.yml).
          RUSTFLAGS: --cfg reqwest_unstable

