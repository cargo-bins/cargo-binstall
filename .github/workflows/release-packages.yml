name: Build packages for release

on:
  workflow_call:
    inputs:
      CARGO_PROFILE_RELEASE_LTO:
        description: "Used to speed up CI"
        required: false
        type: string
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS:
        description: "Used to speed up CI"
        required: false
        type: string
      cache:
        description: "Restore and save build caches; must be false for real releases"
        required: false
        type: boolean
        default: false
    secrets:
      CI_RELEASE_TEST_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  JUST_TIMINGS: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { o: macos-latest, t: x86_64-apple-darwin }
          - { o: macos-latest, t: aarch64-apple-darwin }
          - {
              o: ubuntu-latest,
              t: x86_64-unknown-linux-gnu,
              g: 2.17,
              c: true,
            }
          - {
              o: ubuntu-latest,
              t: armv7-unknown-linux-gnueabihf,
              g: 2.17,
              c: true,
            }
          - { o: ubuntu-latest, t: aarch64-unknown-linux-gnu, g: 2.17, c: true }
          - { o: ubuntu-latest, t: x86_64-unknown-linux-musl, c: true }
          - { o: ubuntu-latest, t: armv7-unknown-linux-musleabihf, c: true }
          - { o: ubuntu-latest, t: aarch64-unknown-linux-musl, c: true }
          - { o: windows-latest, t: x86_64-pc-windows-msvc }
          - { o: windows-11-arm, t: aarch64-pc-windows-msvc }
          - { o: ubuntu-latest, t: riscv64gc-unknown-linux-musl, c: true }

    name: ${{ matrix.t }}
    runs-on: ${{ matrix.o }}
    permissions:
      contents: read
    env:
      CARGO_BUILD_TARGET: ${{ matrix.t }}
      GLIBC_VERSION: ${{ matrix.g }}
      JUST_USE_CARGO_ZIGBUILD: ${{ matrix.c }}
      JUST_FOR_RELEASE: true
      JUST_ENABLE_H3: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Override release profile lto settings
        if: inputs.CARGO_PROFILE_RELEASE_LTO
        run: echo "CARGO_PROFILE_RELEASE_LTO=$LTO" >> "$GITHUB_ENV"
        shell: bash
        env:
          LTO: ${{ inputs.CARGO_PROFILE_RELEASE_LTO }}

      - name: Override release profile codegen-units settings
        if: inputs.CARGO_PROFILE_RELEASE_CODEGEN_UNITS
        run: echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=$CODEGEN_UNITS" >> "$GITHUB_ENV"
        shell: bash
        env:
          CODEGEN_UNITS: ${{ inputs.CARGO_PROFILE_RELEASE_CODEGEN_UNITS }}

      - uses: ./.github/actions/just-setup
        with:
          indexcache: ${{ inputs.cache }}
          buildcache: ${{ inputs.cache }}
        env:
          # just-setup use binstall to install sccache,
          # which works better when we provide it with GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN }}

      - run: just toolchain rust-src

      - run: just package
      - if: runner.os == 'Windows'
        run: Get-ChildItem packages/
      - if: runner.os != 'Windows'
        run: ls -shal packages/

      - name: Ensure release binary is runnable
        if: "matrix.r"
        run: just e2e-tests
        env:
          GITHUB_TOKEN: ${{ secrets.CI_RELEASE_TEST_GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.t }}
          path: packages/cargo-binstall-*
          retention-days: 1

      - name: Upload timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.t }}-cargo-timings
          path: target/cargo-timings
          retention-days: 1

  lipo:
    needs: build
    name: universal-apple-darwin
    permissions:
      contents: read
    runs-on: macos-latest
    env:
      JUST_FOR_RELEASE: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-x86_64-apple-darwin
          path: packages/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-aarch64-apple-darwin
          path: packages/

      - run: ls -shalr packages/
      - run: just repackage-lipo
      - run: ls -shal packages/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-universal-apple-darwin
          path: packages/cargo-binstall-universal-*
          retention-days: 1
