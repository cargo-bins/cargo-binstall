[package]
name = "binstalk-fetchers"
version = "0.10.54"
edition = "2024"

description = "The binstall fetchers"
repository = "https://github.com/cargo-bins/cargo-binstall"
documentation = "https://docs.rs/binstalk-fetchers"
rust-version = "1.88.0"
authors = ["Jiahao XU <Jiahao_XU@outlook.com>"]
license = "GPL-3.0-only"

[dependencies]
async-trait = "0.1.88"
aws-lc-rs = { version = "1.19.0", optional = true }
binstalk-downloader = { version = "0.14.2", path = "../binstalk-downloader", default-features = false }
binstalk-git-repo-api = { version = "0.5.54", path = "../binstalk-git-repo-api" }
binstalk-types = { version = "0.11.0", path = "../binstalk-types" }
bytes = "1.11.1"
compact_str = { version = "0.10.0" }
either = "1.11.0"
itertools = "0.15.0"
leon = "3.0.0"
leon-macros = "1.0.1"
miette = "7.0.0"
minisign-verify = "0.3.0"
serde_json = { version = "1.0.149", optional = true }
# Only verifies against the trusted roots embedded in sigstore-trust-root:
# its `tuf` feature would fetch them with its own HTTP client.
sigstore-verify = { version = "0.17.0", default-features = false, features = [
    "aws-lc-rs",
], optional = true }
strum = "0.28.0"
thiserror = "2.0.11"
tokio = { version = "1.52.3", features = [
    "rt",
    "sync",
], default-features = false }
tracing = "0.1.43"
url = "2.5.8"

[dev-dependencies]
binstalk-bins = { version = "0.8.0", path = "../binstalk-bins" }
binstalk-downloader = { version = "0.14.2", path = "../binstalk-downloader" }

[features]
default = ["github-attestations", "sigstore-signing"]

quickinstall = []

# Verify GitHub artifact attestations of GitHub release assets.
github-attestations = ["dep:aws-lc-rs", "dep:serde_json", "dep:sigstore-verify"]

# Verify Sigstore bundles of keyless signatures, e.g. made by cosign.
sigstore-signing = ["dep:aws-lc-rs", "dep:serde_json", "dep:sigstore-verify"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true
