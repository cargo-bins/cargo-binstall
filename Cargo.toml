[workspace]
resolver = "2"
members = [
    "crates/atomic-file-install",
    "crates/bin",
    "crates/binstalk",
    "crates/binstalk-bins",
    "crates/binstalk-fetchers",
    "crates/binstalk-registry",
    "crates/binstalk-manifests",
    "crates/binstalk-types",
    "crates/binstalk-downloader",
    "crates/cargo-toml-workspace",
    "crates/detect-wasi",
    "crates/fs-lock",
    "crates/normalize-path",
    "crates/detect-targets",
    "crates/binstalk-git-repo-api",
]

[profile.release]
# cargo-binstall is network-bound, so optimise for size: this makes the
# release binary ~36% smaller than opt-level 3 with no measurable slowdown.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.build-override]
inherits = "dev.build-override"

# Pure-Rust inflate (tgz via zlib-rs, zip deflate via miniz_oxide) is the only
# hot path that gets noticeably slower (13-22% CPU) at opt-level "z".
[profile.release.package."zlib-rs"]
opt-level = 3

[profile.release.package."miniz_oxide"]
opt-level = 3

[profile.dev]
opt-level = 0
debug = "line-tables-only"
lto = false
debug-assertions = true
overflow-checks = true
codegen-units = 32

# Set the default for dependencies on debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package."astral-tokio-tar"]
opt-level = "z"

[profile.dev.package."binstall-tar"]
opt-level = "z"

[profile.dev.build-override]
inherits = "dev"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.check-only]
inherits = "dev"
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"

[profile.check-only.build-override]
inherits = "check-only"

[profile.check-only.package."*"]
inherits = "check-only"
# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[workspace.metadata.typos.default]
extend-ignore-words-re = [
    '^[a-zA-Z]{1,2}$' # ignore words up to length 2
]

[patch.crates-io]
# TODO: drop once cargo-bins/simple-git#168 is released, and bump
# binstalk-registry's simple-git requirement to that version.
simple-git = { git = "https://github.com/cargo-bins/simple-git", branch = "shallow-fetch-head" }
